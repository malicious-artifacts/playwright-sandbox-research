<!doctype html>
<!-- SIMULATED ATTACKER PAGE — research artifact. Contains NO exploit code.
     It does what real attacker pages do BEFORE exploitation: fingerprint the
     browser build and confirm the target is vulnerable. -->
<html>
<head><title>just a normal page</title></head>
<body>
  <h1>totally legit content</h1>
  <pre id="status">fingerprinting...</pre>
  <script>
    // Real attacker behavior: version fingerprinting to select targets.
    const ua = navigator.userAgent;
    const m = /HeadlessChrome\/(\d+)\.(\d+)\.(\d+)\.(\d+)/.exec(ua) ||
              /Chrome\/(\d+)\.(\d+)\.(\d+)\.(\d+)/.exec(ua);
    const el = document.getElementById('status');
    if (!m) {
      el.textContent = 'not a chrome-family browser: ' + ua;
    } else {
      const major = +m[1], build = +m[3], patch = +m[4];
      // CVE-2026-118306 and friends were fixed in 156.0.8078.73 (Oct 27) and
      // 156.0.8078.79 (Oct 29). Playwright 1.64.1 ships 156.0.8078.4.
      const vulnerable = major === 156 && build === 8078 && patch < 73;
      el.textContent = 'build ' + major + '.' + m[2] + '.' + build + '.' + patch +
        (vulnerable ? ' => VULNERABLE TARGET (Oct 2026 criticals unpatched)' : ' => patched/not in scope');
      if (vulnerable) {
        // In a real attack this fetch would be made by the exploit after native
        // code execution. Here the page itself signals the harness to proceed
        // with the SIMULATED post-exploitation stage. No exploit is delivered.
        fetch('/stage-2?build=' + build + '.' + patch);
      }
    }
  </script>
</body>
</html>
