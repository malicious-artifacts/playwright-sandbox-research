name: fingerprint-and-sandbox-audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        # audit mode: monitor and report egress, don't block anything
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install playwright@1.64.1 (npm packages only, no browsers yet)
        run: npm install --no-fund --no-audit

      - name: Fingerprint the pinned browser build (pre-download)
        run: node scripts/01-fingerprint.js

      - name: Download the bundled Chromium (check harden-runner egress insights for this step)
        run: npx playwright install chromium --with-deps

      - name: Report installed browser versions
        run: |
          ls "$HOME/.cache/ms-playwright"
          "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux/chrome --version || true
          "$HOME"/.cache/ms-playwright/chromium_headless_shell-*/chrome-linux/headless_shell --version || true

      - name: Sandbox audit (default launch options)
        run: node scripts/02-sandbox-audit.js
